name: Shared CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kerosene-shared
      - uses: actions/checkout@v4
        with:
          repository: Daniel-Astrofer/kerosene-contracts
          path: kerosene-contracts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify shared runtime
        working-directory: kerosene-shared
        run: ./gradlew check --no-daemon
